<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 718" role="img" aria-label="National Captioning Institute">
  <title>National Captioning Institute</title>
  <g fill="#000">
    <!-- Speech-bubble mark: solid square with a pillowed screen knocked out,
         and a tail dropping from the lower left. -->
    <path d="M25 15 H585 V512 H310 L332 690 L150 512 H25 Z"/>
    <path d="M141 148
             C 250 128, 360 128, 468 148
             C 486 246, 486 340, 468 400
             C 360 420, 250 420, 141 400
             C 123 320, 123 226, 141 148 Z" fill="#fff"/>
    <!-- Registered mark, sitting to the right of the tail as in the original. -->
    <circle cx="530" cy="588" r="52" fill="none" stroke="#000" stroke-width="13"/>
    <text x="530" y="609" text-anchor="middle"
          font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="400">R</text>
  </g>
  <!-- Wordmark: three letterspaced lines in a light geometric sans. -->
  <g fill="#000" font-family="Century Gothic, Futura, Avenir Next, Helvetica, Arial, sans-serif"
     font-weight="300" font-size="152">
    <text x="640" y="140" letter-spacing="28">NATIONAL</text>
    <text x="640" y="330" letter-spacing="28">CAPTIONING</text>
    <text x="640" y="520" letter-spacing="28">INSTITUTE</text>
  </g>
</svg>
