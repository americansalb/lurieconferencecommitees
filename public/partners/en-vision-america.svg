<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" role="img" aria-label="En-Vision America, featuring ScriptAbility">
  <title>En-Vision America, featuring ScriptAbility</title>
  <defs>
    <!-- The sunburst is concentric rings clipped to a right triangle: square
         corner top-left, hypotenuse falling to the bottom-left. -->
    <clipPath id="eva-tri">
      <path d="M120 118 L620 118 L120 470 Z"/>
    </clipPath>
    <linearGradient id="eva-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8382F"/>
      <stop offset="0.5" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#F2E600"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#eva-tri)">
    <circle cx="205" cy="205" r="600" fill="#E8382F"/>
    <circle cx="205" cy="205" r="430" fill="#F4692B"/>
    <circle cx="205" cy="205" r="330" fill="#F8912A"/>
    <circle cx="205" cy="205" r="240" fill="#FBB03B"/>
    <circle cx="205" cy="205" r="160" fill="#FCCF3F"/>
    <circle cx="205" cy="205" r="88" fill="#FBEC3C"/>
  </g>

  <!-- Wordmark: two lines of a heavy serif, the second in caps. -->
  <g fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="690" y="290" font-size="216">En-Vision</text>
    <text x="690" y="490" font-size="216" letter-spacing="4">AMERICA</text>
  </g>
  <g fill="#1A1A1A">
    <circle cx="1890" cy="452" r="24" fill="none" stroke="#1A1A1A" stroke-width="7"/>
    <text x="1890" y="463" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28">R</text>
  </g>

  <!-- Divider under the parent brand. -->
  <rect x="120" y="556" width="1770" height="9" fill="url(#eva-rule)"/>

  <!-- "featuring" in a blue script. -->
  <text x="120" y="800" fill="#1B3A7A" font-family="'Brush Script MT', 'Segoe Script', cursive"
        font-style="italic" font-size="120">featuring</text>

  <!-- Four overlapping translucent discs. -->
  <g opacity="0.92">
    <circle cx="712" cy="780" r="98" fill="#F5901E"/>
    <circle cx="828" cy="714" r="98" fill="#2BA3B5"/>
    <circle cx="828" cy="848" r="98" fill="#8DC63F"/>
    <circle cx="783" cy="780" r="98" fill="#7B4EA0" opacity="0.72"/>
  </g>

  <!-- ScriptAbility. Sized to the canvas: at the original weight the wordmark
       ran past the right edge and lost its last three letters. The red accent
       on the "i" of Ability is left off rather than guessed at, since its
       position depends on glyph metrics this has no way to measure. -->
  <text x="962" y="836" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="146">ScriptAbility</text>
  <g>
    <circle cx="1922" cy="796" r="21" fill="none" stroke="#1A1A1A" stroke-width="6"/>
    <text x="1922" y="805" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25">R</text>
  </g>
</svg>
